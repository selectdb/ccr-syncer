name: Release Drafter
on:
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch: {}
  push:
    branches: [main, master]
permissions:
  contents: write
  pull-requests: read
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "release-check: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/rn.txt
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST" >> /tmp/rn.txt
          git log --oneline ${LATEST}..HEAD 2>/dev/null | head -20 >> /tmp/rn.txt
          cat /tmp/rn.txt

